{% extends "base.html" %}

{% block title %}VYRON — AI Biometric Attendance System{% endblock %}

{% block content %}
<div class="login-terminal-wrapper">
  <div class="login-terminal-box">
    
    <!-- Terminal Header & Logo -->
    <div class="terminal-header">
      <div class="terminal-logo-icon">
        <i class="fas fa-fingerprint"></i>
      </div>
      <div class="brand-logo-text" style="justify-content: center; font-size: 28px; margin-bottom: 6px;">
        <span class="part-vyron">VYRON</span>
      </div>
      <p style="font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted);">
        AI Biometric Attendance System
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="username">
          <i class="fas fa-user-astronaut neon-cyan" style="margin-right: 6px;"></i> Admin Identifier
        </label>
        <input type="text" id="username" name="username" class="form-control" placeholder="ENTER ADMIN ID (admin)" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          <i class="fas fa-key neon-pink" style="margin-right: 6px;"></i> Access Encryption Key
        </label>
        <input type="password" id="password" name="password" class="form-control" placeholder="ENTER ACCESS KEY (admin123)" required autocomplete="current-password">
      </div>

      <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
        <label style="display: flex; align-items: center; gap: 8px; font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" name="remember" checked style="accent-color: var(--neon-cyan);">
          <span>PERSIST COMMAND SESSION</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 15px;">
        <i class="fas fa-shield-halved"></i>
        <span>AUTHENTICATE ACCESS →</span>
      </button>

      <!-- Terminal Security Footnote -->
      <div style="margin-top: 24px; padding: 12px; background: rgba(0, 245, 255, 0.04); border: 1px dashed var(--border-color); border-radius: var(--radius-sm); font-family: 'Rajdhani', sans-serif; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="status-pulse-dot"></span>
          <span>SECURE BIOMETRIC PROTOCOL</span>
        </div>
        <span class="neon-cyan" style="font-weight: 700;">DEFAULT: admin / admin123</span>
      </div>
    </form>
  </div>
</div>
{% endblock %}
